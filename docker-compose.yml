services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: apidesk
      POSTGRES_PASSWORD: apidesk
      POSTGRES_DB: apidesk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://apidesk:apidesk@db:5432/apidesk
      PANEL_ORIGINS: http://localhost:3000
      ALLOW_CLIENT_REGISTRATION: "true"
      WS_TICKET_SECRET: docker-ws-ticket-secret-change-me
      SESSION_SECRET: unused-in-api
    depends_on:
      - db
      - redis

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/v1/ws/feed
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SESSION_SECRET: docker-session-secret-min-32-chars!!
    depends_on:
      - api

volumes:
  pgdata:
